[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paws"
description = "menu driven SLSsteam manager for Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Source-Available, see LICENSE; not OSI open source" }
dynamic = ["version"]
dependencies = [
    "textual>=3.0",
    "rich>=13.7",
    "pyyaml>=6.0",
    "py7zr>=0.21",
    "cryptography>=41",
]

[project.optional-dependencies]
riced = ["pillow>=10.0", "textual-image>=0.8"]

[project.scripts]
paws = "paws.cli:entrypoint"

[tool.setuptools.dynamic]
version = { attr = "paws.__version__" }

[tool.setuptools.packages.find]
include = ["paws*"]

[tool.setuptools.package-data]
"paws.data" = ["*.json", "ascii/*.txt", "ascii/*.json", "ascii/sfw/*.txt", "ascii/nsfw/*.txt", "img/*.png"]
"paws.tui" = ["*.tcss"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = false